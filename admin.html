<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | Vorknyx MC</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{min-height:100vh;color:white;background:linear-gradient(135deg,#070712,#111126)}

nav{
  padding:15px 6%;display:flex;justify-content:space-between;
  align-items:center;border-bottom:1px solid #292943;
}
.brand{font-size:20px;font-weight:bold}
.logout{
  padding:10px 15px;border:0;border-radius:10px;
  background:#22223b;color:white;cursor:pointer;
}
.container{width:min(1200px,92%);margin:35px auto}
.header{margin-bottom:25px}
.header p{margin-top:8px;color:#9999ae}

.stats{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:15px;margin-bottom:25px;
}
.stat{
  padding:20px;background:#151529;border:1px solid #30304b;
  border-radius:17px;
}
.stat small{color:#88889f}
.stat h2{margin-top:8px}

.apps{display:grid;gap:17px}
.app{
  padding:24px;background:#151529;border:1px solid #30304b;
  border-radius:20px;
}
.app-top{
  display:flex;justify-content:space-between;gap:15px;
  margin-bottom:18px;
}
.mcname{font-size:22px;font-weight:bold}
.email{color:#9999ae;font-size:14px;margin-top:5px}
.status{padding:8px 12px;border-radius:20px;background:#24243b}
.Pending{color:#facc15}
.Accepted{color:#4ade80}
.Rejected{color:#fb7185}

.details{
  display:grid;grid-template-columns:repeat(2,1fr);gap:12px;
}
.detail{padding:14px;background:#0d0d1d;border-radius:12px}
.detail label{display:block;color:#77778f;font-size:11px;margin-bottom:7px}
.full{grid-column:1/-1}
.actions{display:flex;gap:10px;margin-top:18px}
.accept,.reject{
  border:0;padding:11px 17px;border-radius:10px;
  color:white;font-weight:bold;cursor:pointer;
}
.accept{background:#16803c}
.reject{background:#a52d3b}

.denied{
  min-height:100vh;display:flex;justify-content:center;
  align-items:center;text-align:center;padding:20px;
}
.denied-box{
  padding:35px;border-radius:22px;background:#151529;
  border:1px solid #30304b;
}
.denied-box p{color:#aaa;margin:15px 0}
.denied-box a{
  text-decoration:none;color:white;background:#7c3aed;
  padding:12px 17px;border-radius:10px;
}
@media(max-width:800px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .details{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div id="denied" style="display:none" class="denied">
  <div class="denied-box">
    <h1>🔒 Access Denied</h1>
    <p>You do not have admin permission.</p>
    <a href="dashboard.html">Go to Dashboard</a>
  </div>
</div>

<div id="panel" style="display:none">

<nav>
  <div class="brand">👑 VORKNYX MC ADMIN</div>
  <button class="logout" onclick="logoutUser()">Logout</button>
</nav>

<main class="container">

  <div class="header">
    <h1>Staff Applications</h1>
    <p>Review applications from the community.</p>
  </div>

  <div class="stats">
    <div class="stat"><small>TOTAL</small><h2 id="total">0</h2></div>
    <div class="stat"><small>PENDING</small><h2 id="pending">0</h2></div>
    <div class="stat"><small>ACCEPTED</small><h2 id="accepted">0</h2></div>
    <div class="stat"><small>REJECTED</small><h2 id="rejected">0</h2></div>
  </div>

  <div class="apps" id="apps">
    Loading applications...
  </div>

</main>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDnCDPgXObekD5yM66S7bbVPmM7wBlxGro",
  authDomain: "vorknyx-mc26.firebaseapp.com",
  projectId: "vorknyx-mc26",
  storageBucket: "vorknyx-mc26.firebasestorage.app",
  messagingSenderId: "82503255053",
  appId: "1:82503255053:web:3e668302f9d20f98498144"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

/*
  ADD TRUSTED ADMIN EMAILS HERE
*/
const ADMIN_EMAILS=[
  "YOUR_EMAIL@gmail.com",
  "TRUSTED_ADMIN@gmail.com"
].map(email=>email.toLowerCase());

let allowed=false;

onAuthStateChanged(auth,user=>{
  if(!user){
    window.location.href="login.html";
    return;
  }

  if(!ADMIN_EMAILS.includes((user.email||"").toLowerCase())){
    document.getElementById("denied").style.display="flex";
    return;
  }

  allowed=true;
  document.getElementById("panel").style.display="block";
  loadApps();
});

async function loadApps(){
  const box=document.getElementById("apps");

  try{
    const snap=await getDocs(collection(db,"applications"));
    const applications=[];

    snap.forEach(d=>{
      applications.push({
        id:d.id,
        ...d.data()
      });
    });

    document.getElementById("total").textContent=applications.length;
    document.getElementById("pending").textContent=
      applications.filter(a=>a.status==="Pending").length;
    document.getElementById("accepted").textContent=
      applications.filter(a=>a.status==="Accepted").length;
    document.getElementById("rejected").textContent=
      applications.filter(a=>a.status==="Rejected").length;

    applications.sort((a,b)=>
      (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)
    );

    if(!applications.length){
      box.textContent="No applications yet.";
      return;
    }

    box.innerHTML="";

    applications.forEach(a=>{

      const card=document.createElement("div");
      card.className="app";

      card.innerHTML=`
        <div class="app-top">
          <div>
            <div class="mcname">${escapeHTML(a.minecraftName)}</div>
            <div class="email">${escapeHTML(a.email)}</div>
          </div>
          <div class="status ${escapeHTML(a.status)}">
            ${escapeHTML(a.status)}
          </div>
        </div>

        <div class="details">

          <div class="detail">
            <label>DISCORD</label>
            ${escapeHTML(a.discord)}
          </div>

          <div class="detail">
            <label>AGE</label>
            ${escapeHTML(String(a.age))}
          </div>

          <div class="detail">
            <label>APPLYING FOR</label>
            ${escapeHTML(a.rank)}
          </div>

          <div class="detail full">
            <label>WHY STAFF?</label>
            ${escapeHTML(a.reason)}
          </div>

          <div class="detail full">
            <label>PREVIOUS EXPERIENCE</label>
            ${escapeHTML(a.experience)}
          </div>

          <div class="detail full">
            <label>ACTIVITY</label>
            ${escapeHTML(a.activity)}
          </div>

        </div>

        <div class="actions">
          <button class="accept" onclick="changeStatus('${a.id}','Accepted')">
            ✓ Accept
          </button>

          <button class="reject" onclick="changeStatus('${a.id}','Rejected')">
            ✕ Reject
          </button>
        </div>
      `;

      box.appendChild(card);
    });

  }catch(error){
    box.textContent="Error loading applications.";
    console.error(error);
  }
}

window.changeStatus=async function(id,status){

  if(!allowed)return;

  try{
    await updateDoc(
      doc(db,"applications",id),
      {status:status}
    );

    loadApps();

  }catch(error){
    alert(error.message);
  }
};

window.logoutUser=async function(){
  await signOut(auth);
  window.location.href="index.html";
};

function escapeHTML(text){
  const div=document.createElement("div");
  div.textContent=text||"";
  return div.innerHTML;
}
</script>

</body>
</html>
