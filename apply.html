<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply | Vorknyx MC</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{
  min-height:100vh;color:white;padding:30px 15px;
  background:linear-gradient(135deg,#070712,#111126);
}
.container{max-width:800px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
.brand{font-weight:bold;font-size:20px}
.back{
  text-decoration:none;color:white;background:#202038;
  padding:10px 14px;border-radius:10px;
}
.box{
  background:#151529;border:1px solid #30304b;
  padding:30px;border-radius:22px;
}
.subtitle{color:#9999ae;margin:10px 0 25px}
label{display:block;margin:18px 0 8px;font-size:14px;font-weight:bold}
input,select,textarea{
  width:100%;padding:14px;border-radius:11px;
  border:1px solid #30304c;background:#0c0c1c;
  color:white;outline:none;
}
textarea{min-height:120px;resize:vertical}
button{
  width:100%;margin-top:25px;padding:16px;
  border:0;border-radius:12px;color:white;
  font-weight:bold;cursor:pointer;
  background:linear-gradient(90deg,#7c3aed,#2563eb);
}
#message{text-align:center;margin-top:15px}
</style>
</head>

<body>

<div class="container">

  <div class="top">
    <div class="brand">VORKNYX MC</div>
    <a class="back" href="dashboard.html">← Dashboard</a>
  </div>

  <div class="box">
    <h1>Staff Application</h1>
    <p class="subtitle">Answer honestly and carefully.</p>

    <form id="form">

      <label>Minecraft Username</label>
      <input id="minecraftName" required>

      <label>Discord Username</label>
      <input id="discord" required>

      <label>Age</label>
      <input type="number" id="age" min="13" required>

      <label>Applying For</label>
      <select id="rank" required>
        <option value="">Select a rank</option>
        <option value="Helper">Helper</option>
        <option value="Moderator">Moderator</option>
        <option value="Admin">Admin</option>
      </select>

      <label>Why do you want to become staff?</label>
      <textarea id="reason" required></textarea>

      <label>Previous Staff Experience</label>
      <textarea id="experience" required></textarea>

      <label>How active can you be?</label>
      <textarea id="activity" required></textarea>

      <button id="submit">SUBMIT APPLICATION</button>

    </form>

    <div id="message"></div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  collection,
  addDoc,
  query,
  where,
  getDocs,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDnCDPgXObekD5yM66S7bbVPmM7wBlxGro",
  authDomain: "vorknyx-mc26.firebaseapp.com",
  projectId: "vorknyx-mc26",
  storageBucket: "vorknyx-mc26.firebasestorage.app",
  messagingSenderId: "82503255053",
  appId: "1:82503255053:web:3e668302f9d20f98498144"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUser=null;

onAuthStateChanged(auth,user=>{
  if(!user){
    window.location.href="login.html";
    return;
  }

  currentUser=user;
});

document.getElementById("form").addEventListener("submit",async e=>{
  e.preventDefault();

  if(!currentUser)return;

  const button=document.getElementById("submit");
  const message=document.getElementById("message");

  button.disabled=true;
  button.textContent="SUBMITTING...";

  try{

    const q=query(
      collection(db,"applications"),
      where("userId","==",currentUser.uid)
    );

    const existing=await getDocs(q);

    if(!existing.empty){
      message.textContent="You already submitted an application.";
      message.style.color="#facc15";
      button.disabled=false;
      button.textContent="SUBMIT APPLICATION";
      return;
    }

    await addDoc(collection(db,"applications"),{
      userId:currentUser.uid,
      email:currentUser.email,
      minecraftName:document.getElementById("minecraftName").value.trim(),
      discord:document.getElementById("discord").value.trim(),
      age:Number(document.getElementById("age").value),
      rank:document.getElementById("rank").value,
      reason:document.getElementById("reason").value.trim(),
      experience:document.getElementById("experience").value.trim(),
      activity:document.getElementById("activity").value.trim(),
      status:"Pending",
      createdAt:serverTimestamp()
    });

    message.textContent="Application submitted successfully!";
    message.style.color="#4ade80";

    setTimeout(()=>{
      window.location.href="dashboard.html";
    },1200);

  }catch(error){
    message.textContent=error.message;
    message.style.color="#ff6b6b";
    button.disabled=false;
    button.textContent="SUBMIT APPLICATION";
  }
});
</script>

</body>
</html>
