<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Dashboard | VØRKNYX MC</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}

body{
 min-height:100vh;
 color:white;
 background:
 linear-gradient(#000b,#000e),
 url("https://images.unsplash.com/photo-1627856013091-fed6e4e30025?auto=format&fit=crop&w=2000&q=80")
 center/cover fixed;
}

nav{
 height:70px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 25px;
 background:#090909dd;
 border-bottom:1px solid #333;
}

.logo{font-size:22px;font-weight:900}

.logout{
 padding:10px 18px;
 border:0;
 border-radius:10px;
 font-weight:bold;
 cursor:pointer;
}

.container{
 width:92%;
 max-width:1000px;
 margin:45px auto;
}

.welcome h1{font-size:34px}
.welcome p{color:#999;margin-top:8px}

.profile{
 display:flex;
 align-items:center;
 gap:15px;
 margin:30px 0;
 padding:20px;
 border:1px solid #333;
 border-radius:18px;
 background:#111d;
}

.profile img{
 width:60px;
 height:60px;
 border-radius:50%;
}

.profile p{color:#999;font-size:14px;margin-top:5px}

.cards{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:20px;
}

.card{
 padding:30px;
 border-radius:20px;
 background:#111d;
 border:1px solid #333;
 transition:.2s;
}

.card:hover{
 transform:translateY(-5px);
 border-color:#777;
}

.icon{font-size:42px;margin-bottom:15px}

.card h2{margin-bottom:10px}
.card p{color:#999;line-height:1.5;margin-bottom:20px}

.apply{
 width:100%;
 padding:14px;
 border:0;
 border-radius:12px;
 font-weight:bold;
 cursor:pointer;
}

@media(max-width:650px){
 .cards{grid-template-columns:1fr}
 .welcome h1{font-size:27px}
}
</style>
</head>

<body>

<nav>

<div class="logo">⚡ VØRKNYX MC</div>

<button class="logout" id="logout">
LOGOUT
</button>

</nav>


<div class="container">

<div class="welcome">

<h1>
Welcome, <span id="name">Player</span> 👋
</h1>

<p>
Choose an application below.
</p>

</div>


<div class="profile">

<img id="avatar" src="https://via.placeholder.com/100">

<div>

<h3 id="profileName">Loading...</h3>

<p id="email">Loading...</p>

</div>

</div>


<div class="cards">


<div class="card">

<div class="icon">📸</div>

<h2>Media Apply</h2>

<p>
Apply for the VØRKNYX MC Media rank
and become a creator for our community.
</p>

<button class="apply"
onclick="location.href='media-apply.html'">

APPLY FOR MEDIA

</button>

</div>


<div class="card">

<div class="icon">▶️</div>

<h2>YouTube Apply</h2>

<p>
Have a YouTube channel?
Apply for the YouTube creator rank.
</p>

<button class="apply"
onclick="location.href='youtube-apply.html'">

APPLY FOR YOUTUBE

</button>

</div>


</div>

</div>


<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig={
apiKey:"AIzaSyDvMGqwwdvjxMSG9ASZLJinrsQ9qsY5rrI",
authDomain:"vorknyx-mc.firebaseapp.com",
projectId:"vorknyx-mc",
storageBucket:"vorknyx-mc.firebasestorage.app",
messagingSenderId:"YOUR_MESSAGING_SENDER_ID",
appId:"YOUR_APP_ID"
};


const app=initializeApp(firebaseConfig);
const auth=getAuth(app);


onAuthStateChanged(auth,user=>{

if(!user){
location.href="login.html";
return;
}

const name=user.displayName||"Player";

document.getElementById("name").textContent=name;
document.getElementById("profileName").textContent=name;
document.getElementById("email").textContent=user.email||"";

if(user.photoURL){
document.getElementById("avatar").src=user.photoURL;
}

});


document.getElementById("logout").onclick=async()=>{

await signOut(auth);

location.href="login.html";

};

</script>

</body>
</html>
