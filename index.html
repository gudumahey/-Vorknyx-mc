<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>VØRKNYX MC</title>


<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}


body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    color:white;

    background:
    linear-gradient(
        rgba(0,0,0,.75),
        rgba(0,0,0,.92)
    ),
    url("https://images.unsplash.com/photo-1627856013091-fed6e4e30025?auto=format&fit=crop&w=2000&q=80")
    center/cover fixed;

}


.container{

    width:100%;

    max-width:550px;

    padding:42px 28px;

    text-align:center;

    background:rgba(15,15,15,.92);

    border:1px solid #333;

    border-radius:25px;

    backdrop-filter:blur(12px);

    box-shadow:
    0 20px 60px rgba(0,0,0,.6);

}


.logo{

    font-size:40px;

    font-weight:900;

    letter-spacing:2px;

    margin-bottom:10px;

}


.subtitle{

    color:#999;

    margin-bottom:30px;

    font-size:15px;

}


button{

    width:100%;

    padding:16px;

    border:none;

    border-radius:13px;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


button:hover{

    transform:translateY(-2px);

}


.google{

    background:white;

    color:black;

}


.email{

    margin-top:12px;

    background:#222;

    color:white;

    border:1px solid #444;

}


button:disabled{

    opacity:.6;

    cursor:not-allowed;

    transform:none;

}


#message{

    min-height:22px;

    margin-top:18px;

    font-size:14px;

}

</style>

</head>


<body>


<div class="container">


    <div class="logo">

        ⚡ VØRKNYX MC

    </div>


    <div class="subtitle">

        Lifesteal Network • Creator Portal

    </div>


    <!-- GOOGLE LOGIN -->

    <button
        id="googleBtn"
        class="google">

        🔵 Continue with Google

    </button>


    <!-- EMAIL LOGIN -->

    <button
        class="email"
        onclick="window.location.href='login.html'">

        LOGIN WITH EMAIL

    </button>


    <div id="message"></div>


</div>



<script type="module">


/* =========================
   FIREBASE
   ========================= */


import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";



/* =========================
   YOUR FIREBASE CONFIG
   ========================= */


const firebaseConfig = {

    apiKey:
    "AIzaSyDnCDPgXObekD5yM66S7bbVPmM7wBlxGro",

    authDomain:
    "vorknyx-mc26.firebaseapp.com",

    projectId:
    "vorknyx-mc26",

    storageBucket:
    "vorknyx-mc26.firebasestorage.app",

    messagingSenderId:
    "82503255053",

    appId:
    "1:82503255053:web:3e668302f9d20f98498144"

};



/* =========================
   INITIALIZE FIREBASE
   ========================= */


const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const provider =
new GoogleAuthProvider();


const googleBtn =
document.getElementById("googleBtn");


const message =
document.getElementById("message");



/* =========================
   GOOGLE LOGIN
   ========================= */


googleBtn.addEventListener(
"click",
async function(){

    try{

        googleBtn.disabled = true;

        googleBtn.textContent =
        "Opening Google...";


        message.style.color =
        "#aaa";

        message.textContent =
        "Please choose your Google account.";


        /*
         * GOOGLE SIGN IN
         */

        await signInWithPopup(
            auth,
            provider
        );


        message.style.color =
        "#7cff8b";

        message.textContent =
        "Login successful! Redirecting...";


        /*
         * GO DIRECTLY TO DASHBOARD
         */

        setTimeout(()=>{

            window.location.replace(
                "dashboard.html"
            );

        },700);


    }

    catch(error){

        console.error(
            "Google Login Error:",
            error
        );


        googleBtn.disabled = false;

        googleBtn.textContent =
        "🔵 Continue with Google";


        message.style.color =
        "#ff7777";


        if(
            error.code ===
            "auth/popup-closed-by-user"
        ){

            message.textContent =
            "Google login cancelled.";

        }


        else if(
            error.code ===
            "auth/popup-blocked"
        ){

            message.textContent =
            "Popup blocked. Please allow popups.";

        }


        else if(
            error.code ===
            "auth/unauthorized-domain"
        ){

            message.textContent =
            "This domain is not authorized in Firebase.";

        }


        else{

            message.textContent =
            "Google Login Error: " +
            error.message;

        }

    }

});

</script>


</body>

</html>
