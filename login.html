<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login | VØRKNYX MC</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}

body{
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 color:white;
 background:
 linear-gradient(#000a,#000e),
 url("https://images.unsplash.com/photo-1627856013091-fed6e4e30025?auto=format&fit=crop&w=2000&q=80")
 center/cover;
}

.box{
 width:92%;
 max-width:420px;
 padding:35px 28px;
 background:#111d;
 border:1px solid #333;
 border-radius:22px;
 backdrop-filter:blur(12px);
}

.logo{text-align:center;font-size:28px;font-weight:900}
.sub{text-align:center;color:#999;margin:8px 0 25px}

input{
 width:100%;
 padding:15px;
 margin-bottom:13px;
 border:0;
 outline:0;
 border-radius:12px;
 background:#222;
 color:white;
}

button{
 width:100%;
 padding:15px;
 border:0;
 border-radius:12px;
 font-weight:bold;
 cursor:pointer;
}

.login{background:white;color:black}
.google{margin-top:12px;background:#222;color:white;border:1px solid #444}

.or{text-align:center;color:#777;margin:17px}

.bottom{text-align:center;color:#999;margin-top:20px}
.bottom a{color:white;text-decoration:none;font-weight:bold}

#message{text-align:center;margin-top:15px;color:#ff7777;font-size:14px}
</style>
</head>

<body>

<div class="box">

<div class="logo">⚡ VØRKNYX MC</div>
<div class="sub">Welcome back, player.</div>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button class="login" id="loginBtn">LOGIN</button>

<div class="or">OR</div>

<button class="google" id="googleBtn">
🔵 Continue with Google
</button>

<div id="message"></div>

<div class="bottom">
Don't have an account?
<a href="signup.html">Create Account</a>
</div>

</div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
GoogleAuthProvider,
signInWithPopup
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig={
apiKey:"AIzaSyDvMGqwwdvjxMSG9ASZLJinrsQ9qsY5rrI",
authDomain:"vorknyx-mc.firebaseapp.com",
projectId:"vorknyx-mc",
storageBucket:"vorknyx-mc.firebasestorage.app",
messagingSenderId:"YOUR_MESSAGING_SENDER_ID",
appId:"YOUR_APP_ID"
};


const app=initializeApp(firebaseConfig);
const auth=getAuth(app);

const message=document.getElementById("message");


document.getElementById("loginBtn").onclick=async()=>{

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

if(!email||!password){
message.textContent="Please enter email and password.";
return;
}

try{

await signInWithEmailAndPassword(auth,email,password);

location.href="dashboard.html";

}catch(error){

message.textContent="Login failed: "+error.message;

}

};


document.getElementById("googleBtn").onclick=async()=>{

try{

const provider=new GoogleAuthProvider();

await signInWithPopup(auth,provider);

location.href="dashboard.html";

}catch(error){

console.error(error);

message.textContent=error.message;

}

};

</script>

</body>
</html>
