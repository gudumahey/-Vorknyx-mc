<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Sign Up | VØRKNYX MC</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    color:white;
    background:
    linear-gradient(rgba(0,0,0,.72),rgba(0,0,0,.9)),
    url("https://images.unsplash.com/photo-1627856013091-fed6e4e30025?auto=format&fit=crop&w=2000&q=80")
    center/cover;
}

.box{
    width:100%;
    max-width:430px;
    padding:35px 28px;
    background:rgba(17,17,17,.9);
    border:1px solid #333;
    border-radius:22px;
    backdrop-filter:blur(12px);
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.logo{
    text-align:center;
    font-size:29px;
    font-weight:900;
    margin-bottom:8px;
}

.sub{
    text-align:center;
    color:#999;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:15px;
    margin-bottom:13px;
    border:1px solid #333;
    outline:none;
    border-radius:12px;
    background:#222;
    color:white;
    font-size:15px;
}

input:focus{
    border-color:#777;
}

button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:12px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.signup{
    background:white;
    color:black;
}

.google{
    margin-top:12px;
    background:#222;
    color:white;
    border:1px solid #444;
}

.or{
    text-align:center;
    color:#777;
    margin:18px 0;
}

.bottom{
    text-align:center;
    color:#999;
    margin-top:22px;
}

.bottom a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

#message{
    text-align:center;
    margin-top:15px;
    min-height:20px;
    font-size:14px;
    color:#ff7777;
}
</style>
</head>

<body>

<div class="box">

    <div class="logo">⚡ VØRKNYX MC</div>

    <div class="sub">
        Create your creator account.
    </div>

    <input
        id="username"
        type="text"
        placeholder="Username"
    >

    <input
        id="email"
        type="email"
        placeholder="Email"
    >

    <input
        id="password"
        type="password"
        placeholder="Password"
    >

    <input
        id="confirm"
        type="password"
        placeholder="Confirm Password"
    >

    <button class="signup" id="signupBtn">
        CREATE ACCOUNT
    </button>

    <div class="or">
        OR
    </div>

    <button class="google" id="googleBtn">
        🔵 Continue with Google
    </button>

    <div id="message"></div>

    <div class="bottom">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>


<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    createUserWithEmailAndPassword,
    updateProfile,
    GoogleAuthProvider,
    signInWithPopup
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig = {
    apiKey:"AIzaSyDvMGqwwdvjxMSG9ASZLJinrsQ9qsY5rrI",
    authDomain:"vorknyx-mc.firebaseapp.com",
    projectId:"vorknyx-mc",
    storageBucket:"vorknyx-mc.firebasestorage.app",

    messagingSenderId:"YOUR_MESSAGING_SENDER_ID",

    appId:"YOUR_APP_ID"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const message = document.getElementById("message");


function showMessage(text,color){

    message.textContent = text;

    message.style.color = color;

}


// EMAIL SIGNUP

document
.getElementById("signupBtn")
.addEventListener("click",async()=>{

    const username =
    document.getElementById("username")
    .value
    .trim();


    const email =
    document.getElementById("email")
    .value
    .trim();


    const password =
    document.getElementById("password")
    .value;


    const confirm =
    document.getElementById("confirm")
    .value;


    if(
        !username ||
        !email ||
        !password ||
        !confirm
    ){

        showMessage(
            "Please fill all fields.",
            "#ff7777"
        );

        return;
    }


    if(password !== confirm){

        showMessage(
            "Passwords do not match.",
            "#ff7777"
        );

        return;
    }


    if(password.length < 6){

        showMessage(
            "Password must contain at least 6 characters.",
            "#ff7777"
        );

        return;
    }


    try{

        showMessage(
            "Creating your account...",
            "#aaa"
        );


        const userCredential =
        await createUserWithEmailAndPassword(
            auth,
            email,
            password
        );


        await updateProfile(
            userCredential.user,
            {
                displayName:username
            }
        );


        showMessage(
            "Account created successfully! Redirecting...",
            "#7cff8b"
        );


        setTimeout(()=>{

            // IMPORTANT:
            // Signup ke baad dashboard
            window.location.href =
            "dashboard.html";

        },800);


    }
    catch(error){

        console.error(error);

        if(
            error.code ===
            "auth/email-already-in-use"
        ){

            showMessage(
                "This email is already registered.",
                "#ff7777"
            );

        }

        else if(
            error.code ===
            "auth/invalid-email"
        ){

            showMessage(
                "Please enter a valid email.",
                "#ff7777"
            );

        }

        else if(
            error.code ===
            "auth/weak-password"
        ){

            showMessage(
                "Password is too weak.",
                "#ff7777"
            );

        }

        else{

            showMessage(
                error.message,
                "#ff7777"
            );

        }

    }

});


// GOOGLE SIGNUP

document
.getElementById("googleBtn")
.addEventListener("click",async()=>{

    try{

        showMessage(
            "Opening Google...",
            "#aaa"
        );


        const provider =
        new GoogleAuthProvider();


        await signInWithPopup(
            auth,
            provider
        );


        showMessage(
            "Google login successful! Redirecting...",
            "#7cff8b"
        );


        setTimeout(()=>{

            // IMPORTANT:
            // YAHAN feedback.html NAHI HAI
            // DIRECT DASHBOARD HAI

            window.location.href =
            "dashboard.html";

        },800);


    }
    catch(error){

        console.error(error);


        if(
            error.code ===
            "auth/popup-closed-by-user"
        ){

            showMessage(
                "Google sign-in was cancelled.",
                "#ff7777"
            );

        }

        else{

            showMessage(
                error.message,
                "#ff7777"
            );

        }

    }

});

</script>

</body>
</html>
