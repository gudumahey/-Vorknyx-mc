<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | Vorknyx MC</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{
  min-height:100vh;display:flex;justify-content:center;align-items:center;
  padding:20px;color:white;background:linear-gradient(135deg,#070712,#111126);
}
.box{
  width:100%;max-width:420px;padding:35px;text-align:center;
  background:#151529;border:1px solid #343454;border-radius:24px;
}
.logo{
  width:70px;height:70px;margin:auto auto 18px;display:flex;
  align-items:center;justify-content:center;border-radius:18px;
  font-size:30px;font-weight:bold;
  background:linear-gradient(135deg,#7c3aed,#2563eb);
}
h1{margin-bottom:8px}
.subtitle{color:#9999b0;margin-bottom:25px}
input{
  width:100%;padding:15px;margin-bottom:13px;border-radius:12px;
  border:1px solid #30304c;background:#0c0c1c;color:white;outline:none;
}
input:focus{border-color:#8b5cf6}
button{
  width:100%;padding:15px;border:0;border-radius:12px;
  cursor:pointer;font-weight:bold;font-size:15px;
}
.main{color:white;background:linear-gradient(90deg,#7c3aed,#2563eb)}
.google{margin-top:12px;background:white;color:#222}
.divider{margin:15px 0;color:#777}
.bottom{margin-top:20px;color:#aaa;font-size:14px}
.bottom a{color:#a78bfa;text-decoration:none}
#message{margin-top:15px;font-size:14px}
</style>
</head>

<body>

<div class="box">
  <div class="logo">V</div>
  <h1>Create Account</h1>
  <p class="subtitle">Join the Vorknyx MC Staff Portal</p>

  <input type="email" id="email" placeholder="Email Address">
  <input type="password" id="password" placeholder="Create Password">

  <button class="main" onclick="signupUser()">CREATE ACCOUNT</button>

  <div class="divider">OR</div>

  <button class="google" onclick="googleLogin()">Continue with Google</button>

  <div id="message"></div>

  <div class="bottom">
    Already have an account? <a href="login.html">Login</a>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDnCDPgXObekD5yM66S7bbVPmM7wBlxGro",
  authDomain: "vorknyx-mc26.firebaseapp.com",
  projectId: "vorknyx-mc26",
  storageBucket: "vorknyx-mc26.firebasestorage.app",
  messagingSenderId: "82503255053",
  appId: "1:82503255053:web:3e668302f9d20f98498144"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const provider=new GoogleAuthProvider();

function message(text,color){
  const m=document.getElementById("message");
  m.textContent=text;
  m.style.color=color;
}

window.signupUser=async function(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;

  if(!email || !password){
    message("Please fill all fields.","#ff6b6b");
    return;
  }

  if(password.length<6){
    message("Password must be at least 6 characters.","#ff6b6b");
    return;
  }

  try{
    await createUserWithEmailAndPassword(auth,email,password);
    window.location.href="dashboard.html";
  }catch(error){
    message(error.message,"#ff6b6b");
  }
};

window.googleLogin=async function(){
  try{
    await signInWithPopup(auth,provider);
    window.location.href="dashboard.html";
  }catch(error){
    message(error.message,"#ff6b6b");
  }
};
</script>

</body>
</html>
